<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="sp-dark-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#0F172A" />
        </linearGradient>
        <linearGradient id="sp-dark-border" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#D97706" stop-opacity="0.55" />
        </linearGradient>
        <linearGradient id="sp-dark-p" x1="34" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FCD34D" />
            <stop offset="100%" stop-color="#F59E0B" />
        </linearGradient>
    </defs>
    <!-- Squircle Container -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sp-dark-bg)" stroke="url(#sp-dark-border)" stroke-width="2.5" />
    <!-- Subtle inner glow -->
    <rect x="5.5" y="5.5" width="53" height="53" rx="13" stroke="#FBBF24" stroke-opacity="0.16" stroke-width="1" />
    <!-- Letter S (Crisp White for dark-mode contrast) -->
    <path d="M 27.5 22.5 C 26 20 22.5 19.5 19.5 20.5 C 16 21.5 14.5 24.5 15.5 27.5 C 16.5 30.5 20.5 31.5 23 32.5 C 26.5 34 28.5 36.5 27.5 40 C 26.5 43 22.5 44.5 19 44 C 16.5 43.5 15 42.2 14.2 40.8"
          stroke="#F8FAFC" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Letter P (Luminous Amber Gold) -->
    <path d="M 35.5 44 L 35.5 20.5 L 43 20.5 C 47.5 20.5 50 23.2 50 27.2 C 50 31.2 47.5 34 43 34 L 35.5 34"
          stroke="url(#sp-dark-p)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Accent Dot -->
    <circle cx="48" cy="43" r="2.6" fill="#FBBF24" />
</svg>
