<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="sp-dark-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#090F1E" />
        </linearGradient>
        <linearGradient id="sp-dark-rim" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9" />
            <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#B45309" stop-opacity="0.8" />
        </linearGradient>
        <linearGradient id="sp-dark-s" x1="16" y1="16" x2="34" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#CBD5E1" />
        </linearGradient>
        <linearGradient id="sp-dark-p" x1="30" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FDE68A" />
            <stop offset="55%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
    </defs>

    <!-- Squircle Base -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sp-dark-bg)" stroke="url(#sp-dark-rim)" stroke-width="2.2" />
    <rect x="5.5" y="5.5" width="53" height="53" rx="13" stroke="#FBBF24" stroke-opacity="0.14" stroke-width="1" />

    <!-- Merged S-curve flowing into the shared central spine -->
    <path d="M 32 18 H 23 C 18.6 18 16 20.6 16 24.5 C 16 28.4 18.8 30.8 23.5 31.8 L 28.5 32.8 C 31.2 33.4 32 35 32 38.5 C 32 43 28.8 46 23.5 46 H 16.5"
          stroke="url(#sp-dark-s)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interlocking P rising from the shared spine and looping into a portal bowl -->
    <path d="M 32 46 V 18 H 40.5 C 45.2 18 48.5 21.1 48.5 25.5 C 48.5 29.9 45.2 33 40.5 33 H 32"
          stroke="url(#sp-dark-p)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Portal Core / Coin Glint inside P's bowl -->
    <circle cx="40.2" cy="25.5" r="2.7" fill="#FDE68A" />
</svg>
